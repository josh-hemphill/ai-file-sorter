# Do not set CMAKE_GENERATOR here: Linux llama CI uses Unix Makefiles.
# Windows VS 2026 + CMake < 4.2 is handled by scripts/with-cmake-generator.mjs.
[alias]
aifs = "run -p aifs-cli --"
fmt-all = "fmt --all"
clippy-all = "clippy --workspace --all-targets"
test-all = "test --workspace"
engine-bins = "build -p aifs-engine-bin -p aifs-cli -p aifs-worker-media -p aifs-worker-document -p aifs-worker-vision -p aifs-worker-llm"
engine-llm = "build -p aifs-worker-llm --features llama"
