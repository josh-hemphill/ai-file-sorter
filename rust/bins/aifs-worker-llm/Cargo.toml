[package]
name = "aifs-worker-llm"
description = "Isolated language-model worker (stub infer; llama.cpp is a later feature)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "aifs-worker-llm"
path = "src/main.rs"

# Reserved names for later llama.cpp backends; the stub never reports an accelerator.
[features]
default = []
cuda = []
vulkan = []
metal = []

[dependencies]
aifs-domain = { workspace = true }
aifs-protocol = { workspace = true }
aifs-worker-runtime = { workspace = true }

[dev-dependencies]
aifs-worker-client = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
