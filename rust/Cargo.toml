[workspace]
resolver = "2"
members = ["crates/*", "bins/*", "apps/desktop/src-tauri"]
default-members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/josh-hemphill/ai-file-sorter"
rust-version = "1.85"

[workspace.dependencies]
aifs-domain = { path = "crates/aifs-domain" }
aifs-protocol = { path = "crates/aifs-protocol" }
aifs-scanner = { path = "crates/aifs-scanner" }
aifs-relationships = { path = "crates/aifs-relationships" }
aifs-extractors = { path = "crates/aifs-extractors" }
aifs-store = { path = "crates/aifs-store" }
aifs-planner = { path = "crates/aifs-planner" }
aifs-apply = { path = "crates/aifs-apply" }
aifs-engine = { path = "crates/aifs-engine" }
aifs-engine-client = { path = "crates/aifs-engine-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
