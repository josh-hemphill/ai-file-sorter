[package]
name = "aifs-desktop"
version = "0.1.0"
description = "AI File Sorter workspace (Tauri shell)"
authors = ["AI File Sorter"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aifs-domain = { path = "../../../crates/aifs-domain" }
aifs-engine-client = { path = "../../../crates/aifs-engine-client" }
aifs-protocol = { path = "../../../crates/aifs-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
